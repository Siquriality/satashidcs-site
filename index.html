<!doctype html>
<!-- Главная страница сайта SatashiDCS. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SatashiDcs</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08110f;
      --panel: rgba(12, 28, 24, .68);
      --line: rgba(90, 255, 198, .28);
      --green: #60ffc8;
      --amber: #ffcf6a;
      --white: #eefdf8;
      --muted: #8fb6aa;
      --red: #ff5b76;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 16% 18%, rgba(96, 255, 200, .16), transparent 28rem),
        radial-gradient(circle at 84% 72%, rgba(255, 207, 106, .13), transparent 34rem),
        linear-gradient(135deg, #07120f, #0c1718 42%, #111213);
      color: var(--white);
      font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, monospace;
    }

    .shell {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(18px, 4vw, 56px);
    }

    .terminal {
      width: min(1380px, 100%);
      min-height: calc(100vh - clamp(36px, 8vw, 112px));
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(10, 24, 21, .93), rgba(7, 13, 13, .84));
      box-shadow: 0 0 38px rgba(96, 255, 200, .12), inset 0 0 42px rgba(96, 255, 200, .04);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 9px;
      height: 42px;
      padding: 0 16px;
      border-bottom: 1px solid rgba(96, 255, 200, .17);
      background: rgba(3, 9, 8, .54);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 14px currentColor;
    }

    .dot:nth-child(2) {
      background: var(--amber);
    }

    .dot:nth-child(3) {
      background: var(--red);
    }

    .grid {
      display: grid;
      min-height: calc(100vh - clamp(78px, 8vw, 154px));
    }

    .hero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: clamp(28px, 7vw, 96px);
    }

    .prompt {
      color: var(--green);
      font-size: clamp(13px, 1.5vw, 16px);
      margin-bottom: 20px;
      text-shadow: 0 0 18px rgba(96, 255, 200, .5);
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 10vw, 142px);
      line-height: .94;
      letter-spacing: 0;
      text-transform: none;
      text-shadow: 0 0 22px rgba(96, 255, 200, .35), 4px 0 rgba(255, 91, 118, .18), -4px 0 rgba(255, 207, 106, .16);
      white-space: nowrap;
    }

    .employees {
      margin-top: 30px;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 14px;
      color: var(--white);
    }

    .employees strong {
      font-size: clamp(42px, 7vw, 86px);
      line-height: 1;
      color: var(--amber);
      text-shadow: 0 0 22px rgba(255, 207, 106, .32);
    }

    .employees span {
      font-size: clamp(18px, 2.6vw, 32px);
      color: var(--green);
    }

    @media (max-width: 760px) {
      body {
        overflow: hidden;
      }

      .employees {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="terminal" aria-label="SatashiDcs">
      <div class="bar">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <div class="grid">
        <div class="hero">
          <div class="prompt">root@satashidcs:~$ ./status</div>
          <h1>SatashiDcs</h1>
          <div class="employees">
            <strong>504</strong>
            <span>employees</span>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
